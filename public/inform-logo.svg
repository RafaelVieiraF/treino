  </defs>

  <!-- Fundo -->
  <rect width="400" height="400" rx="88" fill="url(#bgGrad)"/>

  <!-- Haltere -->
  <rect x="112" y="189" width="176" height="22" rx="11" fill="#ffffff"/>
  <rect x="150" y="172" width="16" height="56" rx="5" fill="#ffffff"/>
  <rect x="234" y="172" width="16" height="56" rx="5" fill="#ffffff"/>
  <rect x="92" y="155" width="62" height="90" rx="10" fill="#22c55e"/>
  <rect x="246" y="155" width="62" height="90" rx="10" fill="#22c55e"/>

  <!-- InForm — dois tons -->
  <text
    x="200"
    y="314"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58"
    font-weight="400"
    letter-spacing="4"
