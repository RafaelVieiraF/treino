  ><tspan fill="#ffffff">In</tspan><tspan fill="#22c55e">Form</tspan></text>

  <!-- Linha decorativa -->
  <rect x="148" y="325" width="104" height="2" rx="1" fill="#22c55e" opacity="0.6"/>
